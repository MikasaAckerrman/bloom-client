name: Build and Deploy
on: [ push, pull_request ]

concurrency:
  group: continuous
  cancel-in-progress: true

# ANDROID ONLY.
#
# The Windows / Linux / macOS / PS Vita jobs were removed: this fork is an
# Android client and nothing else is shipped from here. Keeping them cost ~6
# runners per push and the PS Vita job failed unconditionally (its SDK bootstrap
# step, scripts/psvita_sdk.sh, broke), which in turn blocked the release job
# because that job listed every platform in `needs`.
#
# If a desktop build is ever needed again, the CMake presets for it are still in
# CMakePresets.json -- only the CI jobs are gone.
jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install ccache
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle
      - name: Setup compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: Android-ccache-${{ github.sha }}
          restore-keys: |
            Android-ccache-${{ github.ref_name }}
            Android-ccache-
      - name: Build and Sign APK
        env:
          KEYSTORE_FILE_PATH: ${{ github.workspace }}/signingkey.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "${{ secrets.SIGNING_KEY }}" ]]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ env.KEYSTORE_FILE_PATH }}
            ./gradlew assembleGitContinuous
            mv app/build/outputs/apk/git/continuous/app-git-continuous.apk CS16Client-Android.apk
          else
            ./gradlew assembleGitDebug
            mv app/build/outputs/apk/git/debug/app-git-debug.apk CS16Client-Android.apk
          fi
        working-directory: android
      # The game data (sprites, configs, bot profiles) is delivered through the
      # APK's assets. Fail loudly if it is missing: an APK that installs and runs
      # but silently has no killfeed sprites is worse than a red build.
      - name: Verify game assets are packaged
        run: |
          set -e
          apk=android/CS16Client-Android.apk
          missing=0
          for f in sprites/kf/awp.spr sprites/kf/headshot.spr sprites/kf/plus.spr \
                   BotProfile.db; do
            if unzip -l "$apk" | grep -q "assets/$f"; then
              echo "ok   assets/$f"
            else
              echo "MISSING assets/$f"
              missing=$((missing+1))
            fi
          done
          kf=$(unzip -l "$apk" | grep -c 'assets/sprites/kf/.*\.spr' || true)
          echo "killfeed sprites in APK: $kf"
          [ "$kf" -ge 38 ] || { echo "expected >= 38 killfeed sprites"; missing=$((missing+1)); }
          [ "$missing" -eq 0 ] || { echo "FAILED: $missing asset check(s)"; exit 1; }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android
          path: android/CS16Client-Android.apk
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && always()
    needs: [ android ]
    steps:
      - name: Fetch artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Remove old release
        run: |
          TAG_NAME=${{ github.ref_name == 'main' && 'continuous' || format('continuous-{0}', github.ref_name) }}
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          if gh release list --repo ${{ github.repository }} | grep -q -e "$TAG_NAME"; then
            gh release delete "$TAG_NAME" --yes --cleanup-tag --repo ${{ github.repository }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload new release
        run: |
          TAG_NAME=${{ github.ref_name == 'main' && 'continuous' || format('continuous-{0}', github.ref_name) }}
          gh release create "$TAG_NAME" --title "CS16Client development build" \
            --prerelease --generate-notes \
            CS16Client-* --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
