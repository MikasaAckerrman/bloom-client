import java.time.LocalDateTime
import java.time.Month
import java.time.temporal.ChronoUnit

apply plugin: "com.android.application"

android {
	namespace = "su.xash.cs16client"
	ndkVersion = "28.2.13676358"
	compileSdk = 36

	defaultConfig {
		applicationId = "su.xash.cs16client"
		versionName = "1.35-" + getGitHash()
		versionCode = getBuildNum()
		minSdk = 21
		targetSdk = 36
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_11
		targetCompatibility = JavaVersion.VERSION_11
	}

	externalNativeBuild {
		cmake {
			version = "3.22.1"
			path file("../../CMakeLists.txt")
		}
	}

	lint {
		abortOnError = false
	}

	// Game data (sprites, bot profiles, configs, YaPB navigation graphs) ships in
	// the APK's assets. Point Gradle straight at the source directories instead of
	// copying them into src/main/assets first.
	//
	// The copy used to be done by CMake's configure step, which CANNOT work:
	// Gradle runs mergeAssets BEFORE configuring CMake (checked against a CI log:
	// mergeGitDebugAssets is task #433, configureCMakeDebug[arm64-v8a] is #447).
	// On a clean checkout the assets were therefore packaged from a directory that
	// did not exist yet, so every CI APK shipped with NO game data -- verified by
	// unzipping two published artifacts, both had 0 asset entries. It only looked
	// fine locally because the directory lingered from an earlier build.
	//
	// The graphs are downloaded by scripts/yapb_graph_dl.py into the CMake build
	// dir, which is not known here, so they are fetched into a fixed path under
	// the module's build dir by the task below.
	sourceSets {
		named("main") {
			assets.srcDirs += [
				file("../../3rdparty/cs16client-extras"),
				file("../../3rdparty/yapb/cfg"),
				file("${layout.buildDirectory.get().asFile}/generated/yapb-graphs")
			]
		}
	}

	packaging {
		jniLibs {
			keepDebugSymbols.add("**/*.so")
			useLegacyPackaging = true
		}
	}

	signingConfigs {
		debug {}

		continuous {
			if (System.getenv('KEYSTORE_FILE_PATH') != null) {
				storeFile = file(System.getenv('KEYSTORE_FILE_PATH'))
				storePassword = System.getenv('KEYSTORE_PASSWORD')
				keyAlias = System.getenv('KEY_ALIAS')
				keyPassword = System.getenv('KEY_PASSWORD')
			}
		}
	}

	buildTypes {
		debug {
			debuggable = true
			applicationIdSuffix = ".test"

			proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.txt"
		}

		release {
			minifyEnabled = true
			shrinkResources = true

			proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.txt"
		}

		create("continuous") {
			initWith(getByName("release"))
			applicationIdSuffix = ".test"
			signingConfig = signingConfigs.continuous

			externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
                }
			}
		}
	}

	flavorDimensions += "version"

	productFlavors {
		create("googlePlay") {
			dimension = "version"
			applicationId = "in.celest.xash3d.cs16client"
			buildConfigField("Boolean", "IS_GOOGLE_PLAY_BUILD", "true")
		}

		create("git") {
			dimension = "version"
			buildConfigField("Boolean", "IS_GOOGLE_PLAY_BUILD", "false")
		}
	}

	buildFeatures {
		buildConfig = true
	}
}

// Download the YaPB navigation graphs into a fixed directory that sourceSets can
// reference, and make asset merging depend on it. scripts/yapb_graph_dl.py skips
// files it already has, so repeat runs are cheap; a failed download is
// non-fatal (the script prints and continues), which matches how the CMake path
// behaved.
//
// Declared as an Exec task rather than calling exec {} inside doLast: on Gradle
// 8.13 (this project's wrapper) invoking Project.exec at execution time is
// unsupported and breaks the configuration cache.
def yapbGraphsDir = layout.buildDirectory.dir("generated/yapb-graphs")

def fetchYapbGraphs = tasks.register("fetchYapbGraphs", Exec) {
	description = "Fetch YaPB navigation graphs into the assets staging dir"
	outputs.dir(yapbGraphsDir)
	def graphDir = yapbGraphsDir.map { it.dir("addons/yapb/data/graph") }
	doFirst {
		graphDir.get().asFile.mkdirs()
	}
	commandLine(
		System.getenv("PYTHON") ?: "python3",
		file("../../scripts/yapb_graph_dl.py").absolutePath,
		graphDir.get().asFile.absolutePath
	)
}

tasks.configureEach { task ->
	if (task.name.startsWith("merge") && task.name.endsWith("Assets")) {
		task.dependsOn(fetchYapbGraphs)
	}
}

static def getBuildNum() {
	LocalDateTime now = LocalDateTime.now()
	LocalDateTime releaseDate = LocalDateTime.of(2015, Month.OCTOBER, 29, 0, 0, 0)
	int qBuildNum = releaseDate.until(now, ChronoUnit.DAYS)
	int minuteOfDay = now.getHour() * 60 + now.getMinute()
	return qBuildNum * 10000 + minuteOfDay
}

def getGitHash() {
	Process process = new ProcessBuilder("git", "rev-parse", "--short", "HEAD")
			.directory(project.rootDir)
			.redirectErrorStream(true)
			.start()
	InputStreamReader inputStreamReader = new InputStreamReader(process.getInputStream())
	BufferedReader bufferedReader = new BufferedReader(inputStreamReader)

	return bufferedReader.getText().trim()
}